<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Image Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      transition: background-color 0.8s ease;
    }

    img {
      width: 90vw;
      max-width: 800px;
      height: auto;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .button-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 400px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #ccc;
      color: #000;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #aaa;
    }

    @media (min-width: 768px) {
      .button-container {
        flex-direction: row;
        justify-content: center;
      }

      button {
        width: auto;
        min-width: 180px;
      }
    }
  </style>
</head>
<body>
  <img id="randomImage" alt="Random Image" crossorigin="anonymous" />
  <div class="button-container">
    <button onclick="window.location.href='https://www.instagram.com/fact.o.frame/'">Follow on Instagram</button>
    <button onclick="window.location.reload()">New Fact</button>
  </div>

  <script>
    const totalImages = 9; // adjust to your number of images
    const image = document.getElementById('randomImage');
    const colorThief = new ColorThief();

    function getRandomImage() {
      const randomIndex = Math.floor(Math.random() * totalImages) + 1;
      const imagePath = `https://hinal150198.github.io/random-image-generator/${randomIndex}.jpg`;
      image.src = imagePath;

      // When image is loaded, extract color and set background
      image.onload = function () {
        // Wait for image to render and check if it’s completely loaded
        if (image.complete) {
          const color = colorThief.getColor(image);
          document.body.style.backgroundColor = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
        }
      };
    }

    window.onload = getRandomImage;
  </script>
</body>
</html>
