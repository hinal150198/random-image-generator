<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Image Generator</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    img {
      width: 90vw;
      max-width: 800px;     /* Bigger max width for desktops */
      height: auto;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .button-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 400px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #ccc; /* Change to #fff for white */
      color: #000;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #aaa;
    }

    @media (min-width: 768px) {
      .button-container {
        flex-direction: row;
        justify-content: center;
      }

      button {
        width: auto;
        min-width: 180px;
      }
    }
  </style>
</head>
<body>
  <img id="randomImage" alt="Random Image" />

  <div class="button-container">
    <button onclick="window.location.href='https://www.instagram.com/fact.o.frame/'">
      Follow on Instagram
    </button>
    <button onclick="window.location.reload()">
      New Fact
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
