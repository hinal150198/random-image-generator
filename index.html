<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Image Generator</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000; /* black background */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    img {
      width: 95vw;       /* Almost full screen width */
      max-width: 500px;  /* Cap for larger screens */
      height: auto;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 90%;
      max-width: 400px;
    }

    button {
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #ccc; /* grey button (change to #fff for white) */
      color: #000;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #aaa; /* darker grey on hover */
    }
  </style>
</head>
<body>
  <img id="randomImage" alt="Random Image" />

  <div class="button-container">
    <button onclick="window.location.href='https://www.instagram.com/fact.o.frame/'">
      Follow on Instagram
    </button>
    <button onclick="window.location.reload()">
      New Fact
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
